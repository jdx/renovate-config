name: mise-lock

# Reusable workflow: regenerates mise.lock on Renovate branches.
#
# Renovate's mise manager updates mise.toml but leaves mise.lock stale on
# the Mend hosted app, which does not run postUpgradeTasks (the same gap
# aube-lock.yml closes for aube). CI then fails on
# `mise install --locked` with "<tool>@<version> is not in the lockfile".
# This workflow runs on pushes to renovate/** branches, regenerates the
# lockfile, and commits it back.
#
# Caller repos add (with `permissions: contents: write`):
#
#   name: mise-lock
#   on:
#     push:
#       branches: ["renovate/**"]
#   permissions:
#     contents: write
#   jobs:
#     mise-lock:
#       uses: jdx/renovate-config/.github/workflows/mise-lock.yml@<sha>
#       with:
#         post_update_task: render
#         post_update_paths: |
#           content/cli
#       secrets:
#         MISE_LOCK_APP_ID: ${{ secrets.MISE_LOCK_APP_ID }}
#         MISE_LOCK_APP_PRIVATE_KEY: ${{ secrets.MISE_LOCK_APP_PRIVATE_KEY }}
#
# Callers whose generated files depend on the locked tool versions (for
# example a CLI reference rendered by `usage`) pass the mise task that
# regenerates them as post_update_task, and list those paths under
# post_update_paths so they are committed alongside the lockfile.
# Package-manager sidecars under .mise/locks/ (lockfile_version = 2) are
# committed automatically and need no entry there.
#
# Secrets (optional but recommended): MISE_LOCK_APP_ID and
# MISE_LOCK_APP_PRIVATE_KEY for a GitHub App with contents:write. When
# present, the lockfile commit is pushed with a short-lived App token so
# it retriggers CI on the Renovate branch. Without them the workflow
# falls back to GITHUB_TOKEN, which still fixes the lockfile but does
# NOT retrigger workflows (GitHub's recursion guard), so the PR's checks
# must be re-run manually.
#
# The committer author must be listed in gitIgnoredAuthors in the shared
# Renovate config (see default.json) so Renovate keeps rebasing branches
# we have committed to.

on:
  workflow_call:
    inputs:
      post_update_task:
        description: Optional mise task that regenerates dependency-derived files
        required: false
        type: string
        default: ""
      post_update_paths:
        description: Newline-separated paths generated by post_update_task
        required: false
        type: string
        default: ""
    secrets:
      MISE_LOCK_APP_ID:
        description: GitHub App ID used to push lockfile commits (optional)
        required: false
      MISE_LOCK_APP_PRIVATE_KEY:
        description: GitHub App private key used to push lockfile commits (optional)
        required: false

jobs:
  mise-lock:
    # Only react to Renovate's own pushes (checked by the event sender's
    # immutable numeric id, not a spoofable login); our fix-up push has a
    # different sender, so this also prevents self-retriggering.
    if: github.event.sender.id == 29139614 # renovate[bot]
    runs-on: ubuntu-latest
    concurrency:
      group: mise-lock-${{ github.ref }}
      cancel-in-progress: true
    env:
      # secrets context is not allowed in step-level `if`; surface the
      # presence check via env. Both secrets must be set, otherwise fall
      # back to GITHUB_TOKEN instead of failing the token step
      MISE_LOCK_HAS_APP: ${{ secrets.MISE_LOCK_APP_ID != '' && secrets.MISE_LOCK_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Generate app token
        id: app-token
        if: env.MISE_LOCK_HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MISE_LOCK_APP_ID }}
          private-key: ${{ secrets.MISE_LOCK_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `install: false` is load-bearing: the whole point of this workflow
      # is that the lockfile is stale, so mise-action's default
      # `mise install --locked` would fail before we get a chance to fix it.
      # This step only puts the mise CLI on PATH.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: false
      - name: Regenerate mise lockfiles
        id: lockfiles
        env:
          # `mise lock` resolves releases through the GitHub API; without a
          # token it is rate limited per runner IP.
          GITHUB_TOKEN: ${{ github.token }}
          # `mise lock` otherwise loads project config normally, which can
          # execute code (templated env, for instance). Safe mode is a hard
          # boundary against that: the config is inert, so it can neither run
          # code nor inject environment. Renovate's own mise manager relies on
          # this for the same command. Requires mise >= 2026.7.12, which
          # mise-action installs by default.
          MISE_SAFE: "1"
        # Regenerate every tracked lockfile, not just the root one: a repo may
        # keep a nested mise.lock beside a subdirectory's mise.toml, and may
        # track several in one directory.
        #
        # Each lockfile selects which config `mise lock` writes, so the name
        # has to be decoded rather than reduced to its directory (mise's
        # lockfile_path_for_config):
        #
        #   mise.lock              default
        #   mise.local.lock        --local
        #   mise.<env>.lock        MISE_ENV=<env>
        #   mise.<env>.local.lock  MISE_ENV=<env> --local
        #
        # NUL-delimited so paths containing whitespace survive the loop.
        run: |
          set -euo pipefail
          found=false
          while IFS= read -r -d '' lock; do
            dir="$(dirname "$lock")"
            base="$(basename "$lock")"
            env_name=""
            is_local=false
            # .local variants must precede the bare env pattern, which would
            # otherwise swallow them with env_name="<env>.local".
            case "$base" in
              mise.lock) ;;
              mise.local.lock) is_local=true ;;
              mise.*.local.lock)
                env_name="${base#mise.}"
                env_name="${env_name%.local.lock}"
                is_local=true
                ;;
              mise.*.lock)
                env_name="${base#mise.}"
                env_name="${env_name%.lock}"
                ;;
              *)
                echo "skipping unrecognized lockfile $lock"
                continue
                ;;
            esac
            found=true
            echo "regenerating $lock"
            (
              cd "$dir"
              if [ -n "$env_name" ]; then
                export MISE_ENV="$env_name"
              fi
              if [ "$is_local" = true ]; then
                mise lock --local
              else
                mise lock
              fi
            ) || exit 1
          done < <(git ls-files -z -- '*mise.lock' '*mise.*.lock' | sort -zu)
          if [ "$found" = false ]; then
            echo "no mise lockfile in this repo, nothing to do"
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - name: Regenerate dependency-derived files
        if: steps.lockfiles.outputs.found == 'true' && inputs.post_update_task != ''
        env:
          POST_UPDATE_TASK: ${{ inputs.post_update_task }}
        # the lockfile is correct as of the previous step, so the tools the
        # task needs can now be installed from it.
        run: |
          set -euo pipefail
          mise install
          mise run "$POST_UPDATE_TASK"
      - name: Commit and push if changed
        if: steps.lockfiles.outputs.found == 'true'
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          POST_UPDATE_PATHS: ${{ inputs.post_update_paths }}
        run: |
          set -euo pipefail
          # Staged through ls-files rather than `git add -- <glob>`: git treats
          # an unmatched pathspec as fatal, so a repo tracking only mise.lock
          # would die on the mise.*.lock glob and never push the fix. `-r`
          # keeps git add from running argument-less when nothing matches, and
          # -z/-0 preserves paths containing whitespace.
          git ls-files -z -- '*mise.lock' '*mise.*.lock' | xargs -0 -r git add --
          # A v2 lockfile pins npm tools through sidecars that `mise lock`
          # writes under .mise/locks/ beside the lockfile, and it deletes the
          # previous version's sidecar. A new version's sidecar is untracked,
          # so the ls-files pass above never sees it: staging only mise.lock
          # pushed a lockfile pointing at a sidecar that was not committed,
          # and every locked install failed (jdx/hk#1411). `-A` records the
          # deletion too. Guarded because git rejects a pathspec that matches
          # nothing, which is the case for a repo without sidecars.
          git ls-files -z -- '*mise.lock' '*mise.*.lock' |
            while IFS= read -r -d '' lock; do
              locks="$(dirname "$lock")/.mise/locks"
              if [ -e "$locks" ] || [ -n "$(git ls-files -- "$locks")" ]; then
                git add -A -- "$locks"
              fi
            done
          while IFS= read -r path; do
            if [ -n "$path" ]; then
              git add -- "$path"
            fi
          done <<< "$POST_UPDATE_PATHS"
          if git diff --cached --quiet; then
            echo "dependency artifacts already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The paths this job changed, so a rejected push can ask whether
          # they are already on the branch.
          changed_paths="$(git diff --cached --name-only)"
          # The commit this job builds on. Read before committing: the
          # checkout is a depth-1 shallow clone, where HEAD^ does not resolve
          # even once a commit sits on top of it.
          base="$(git rev-parse HEAD)"
          git commit -m 'chore(deps): regenerate dependency artifacts'
          # Renovate force-pushes the branch while this job runs, so a plain
          # push loses the fix to a non-fast-forward rejection (seen on
          # jdx/hk). Recover by looking at why the branch moved.
          push_url="https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git"
          # Loops until it pushes or gives up: a recovery must always be
          # followed by another push, never left rebased-but-unpushed.
          retries=0
          recoveries=0
          while true; do
            # The lease pins the push to the tip we built on, so it is
            # rejected rather than silently recreating a branch Renovate
            # deleted or clobbering a newer one.
            if git push --force-with-lease="refs/heads/${BRANCH}:${base}" "$push_url" "HEAD:${BRANCH}"; then
              exit 0
            fi
            # Never retry a push without knowing the branch's current state:
            # the fetch also fails when Renovate has deleted the branch, and
            # a blind retry would recreate it.
            if ! git fetch --quiet "$push_url" "$BRANCH"; then
              echo "::error::could not fetch ${BRANCH} to see why the push was rejected; not retrying (the branch may have been deleted)"
              exit 1
            fi
            # --verify --quiet prints nothing on failure; plain rev-parse
            # would echo the literal "FETCH_HEAD" and be mistaken for a sha.
            remote="$(git rev-parse --verify --quiet "FETCH_HEAD^{commit}" || true)"
            if [ -z "$remote" ]; then
              echo "::error::fetched ${BRANCH} but could not resolve its tip"
              exit 1
            fi
            if [ "$remote" = "$base" ]; then
              # The branch is where we left it, so the push itself failed.
              retries=$((retries + 1))
              if [ "$retries" -gt 3 ]; then
                echo "::error::could not push regenerated dependency artifacts to ${BRANCH} after ${retries} attempts"
                exit 1
              fi
              echo "push failed but ${BRANCH} has not moved; retrying (attempt ${retries})"
              sleep "$((retries * 5))"
              continue
            fi
            # Who moved the branch decides whether anything will regenerate
            # these artifacts: only a Renovate push starts a replacement run
            # (the job's sender gate), and a github-actions[bot] tip is
            # another run of this workflow that has already done the work.
            tip_author="$(git log -1 --format='%an <%ae>' "$remote" 2>/dev/null)"
            case "$tip_author" in
              *'renovate[bot]'*) moved_by=renovate ;;
              *'github-actions[bot]'*) moved_by=sibling ;;
              *) moved_by=foreign ;;
            esac
            # Nothing to do if those artifacts are already on the branch --
            # a sibling run regenerating the same config lands the same bytes.
            if [ -n "$changed_paths" ]; then
              already_there=true
              while IFS= read -r changed; do
                [ -n "$changed" ] || continue
                if ! git diff --quiet "$remote" HEAD -- "$changed"; then
                  already_there=false
                  break
                fi
              done <<< "$changed_paths"
              if [ "$already_there" = true ]; then
                echo "::notice::${BRANCH} already carries these artifacts (pushed by ${tip_author}); nothing to do"
                exit 0
              fi
            fi
            # 0 = unchanged, 1 = changed, anything else = diff failed.
            config_changed=0
            git diff --quiet "$base" "$remote" -- '*mise.toml' '*mise.*.toml' || config_changed=$?
            if [ "$config_changed" -gt 1 ]; then
              retries=$((retries + 1))
              if [ "$retries" -gt 3 ]; then
                echo "::error::could not compare ${base} with ${remote} after ${retries} attempts"
                exit 1
              fi
              echo "could not compare ${base} with ${remote}; retrying (attempt ${retries})"
              sleep "$((retries * 5))"
              continue
            fi
            if [ "$config_changed" -eq 1 ]; then
              # A newer push changed the inputs these artifacts are generated
              # from, so what we regenerated is already out of date. That push
              # started its own run of this workflow, which regenerates from
              # the new state; pushing ours would only overwrite it with stale
              # content.
              if [ "$moved_by" = renovate ]; then
                echo "::notice::${BRANCH} moved and its dependency config changed; the run for that push regenerates these artifacts, so this one stops here"
                exit 0
              fi
              echo "::error::${BRANCH} moved and its dependency config changed, but not by renovate[bot] (tip: ${tip_author}), so no run will regenerate these artifacts; rerun this workflow once the branch settles"
              exit 1
            fi
            # The branch moved for unrelated reasons, so our artifacts still
            # describe the current config: replay them on the new tip.
            echo "${BRANCH} moved without touching the dependency config; rebasing onto ${remote}"
            # --onto replays only the commit made above. A plain rebase would
            # also replay everything under $base that a force-push dropped,
            # restoring content Renovate deliberately removed.
            if ! git rebase --onto "$remote" "$base"; then
              git rebase --abort || true
              if [ "$moved_by" != foreign ]; then
                echo "::notice::rebase onto ${remote} conflicted; ${tip_author} already regenerated these artifacts, so this run stops here"
                exit 0
              fi
              echo "::error::rebase onto ${remote} conflicted and ${BRANCH} was moved by ${tip_author}, so no run will regenerate these artifacts"
              exit 1
            fi
            recoveries=$((recoveries + 1))
            if [ "$recoveries" -gt 3 ]; then
              echo "::error::${BRANCH} moved again after ${recoveries} rebases; giving up rather than fighting it"
              exit 1
            fi
            base="$remote"
          done
