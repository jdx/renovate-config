name: release-plz

permissions: {}

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-plz

jobs:
  release-plz:
    if: github.repository == 'jdx/renovate-config'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_GITHUB_TOKEN || github.token }}
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - run: mise run release-plz
        env:
          DRY_RUN: 0
          # A PAT so the release PR runs CI; GITHUB_TOKEN still opens it.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_GITHUB_TOKEN || github.token }}
